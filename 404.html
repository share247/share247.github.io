<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Share247 — Redirecting</title>
  <meta name="robots" content="noindex, follow">
  <script>
    // GitHub Pages SPA / clean route handler
    const path = window.location.pathname;
    if (path.includes('/admin')) {
      window.location.replace('/admin/');
    } else {
      window.location.replace('/');
    }
  </script>
</head>
<body style="background:#0b0f19;color:#94a3b8;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
  <p>Redirecting to <a href="/" style="color:#38bdf8;">Share247 Cloud Vault</a>...</p>
</body>
</html>
